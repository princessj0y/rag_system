- id: ts4_medium_02
  test_set: 4
  answer_type: medium
  difficulty: medium
  question: >
    According to the author, why does the ending of Crime and Punishment feel unrealistic compared to works like American Psycho?
  answer: >
    The author finds the ending unrealistic because Raskolnikov finds acceptance and a confounding love for Sonya, which turns him into an ordinary remorseful man[cite: 3]. In contrast, characters in works like American Psycho seem more realistic because they maintain a superior sense of themselves and remain steadfast in their commitment to their ideologies without seeking redemption[cite: 3].
