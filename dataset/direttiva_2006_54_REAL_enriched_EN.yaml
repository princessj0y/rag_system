- id: ts1_short_01
  test_set: 1
  answer_type: short
  difficulty: easy
  question: What is the main purpose of Directive 2006/54/EC?
  answer: To ensure the implementation of the principle of equal opportunities and equal treatment of men and women in matters of employment and occupation.
  ground_truth: To ensure the implementation of the principle of equal opportunities and equal treatment of men and women in matters of employment and occupation.
  article_refs:
  - Art. 1
  contexts:
  - Directive 2006/54/EC – Art. 1
  adversarial: false
- id: ts1_short_02
  test_set: 1
  answer_type: short
  difficulty: easy
  question: How is direct discrimination defined in the directive?
  answer: It is where one person is treated less favourably on grounds of sex than another is, has been or would be treated in a comparable situation.
  ground_truth: It is where one person is treated less favourably on grounds of sex than another is, has been or would be treated in a comparable situation.
  article_refs:
  - Art. 2
  contexts:
  - Directive 2006/54/EC – Art. 2
  adversarial: false
- id: ts1_short_03
  test_set: 1
  answer_type: short
  difficulty: easy
  question: Does harassment fall under the concept of discrimination?
  answer: Yes, harassment and sexual harassment are considered forms of discrimination on grounds of sex.
  ground_truth: Yes, harassment and sexual harassment are considered forms of discrimination on grounds of sex.
  article_refs:
  - Art. 2
  contexts:
  - Directive 2006/54/EC – Art. 2
  adversarial: false
