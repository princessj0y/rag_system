- id: ts2_medium_01
  test_set: 2
  answer_type: medium
  difficulty: medium
  question: How are judicial protection and the burden of proof linked in the directive?
  answer: 'The directive strengthens judicial protection by providing for the reversal of the burden of proof: once a presumption of discrimination is established, it is for the respondent to prove that there has been no breach of the principle of equal treatment.'
  ground_truth: 'The directive strengthens judicial protection by providing for the reversal of the burden of proof: once a presumption of discrimination is established, it is for the respondent to prove that there has been no breach of the principle of equal treatment.'
  article_refs:
  - Art. 17
  - Art. 19
  contexts:
  - Directive 2006/54/EC – Art. 17
  - Directive 2006/54/EC – Art. 19
  adversarial: false
- id: ts2_long_01
  test_set: 2
  answer_type: long
  difficulty: hard
  question: Analyze how the directive guarantees the effectiveness of the principle of equal treatment by combining multiple regulatory instruments.
  answer: The effectiveness of the principle of equality is guaranteed by an integrated system that includes the prohibition of discrimination, judicial protection, the reversal of the burden of proof, the absence of upper limits on compensation, and protection against victimization. Added to this is the role of equality bodies and dialogue with social partners, creating a coherent framework for the prevention and repression of discrimination.
  ground_truth: The effectiveness of the principle of equality is guaranteed by an integrated system that includes the prohibition of discrimination, judicial protection, the reversal of the burden of proof, the absence of upper limits on compensation, and protection against victimization. Added to this is the role of equality bodies and dialogue with social partners, creating a coherent framework for the prevention and repression of discrimination.
  article_refs:
  - Title II
  - Title III
  - Art. 17
  - Art. 19
  contexts:
  - Directive 2006/54/EC – Title II
  - Directive 2006/54/EC – Title III
  - Directive 2006/54/EC – Art. 17
  - Directive 2006/54/EC – Art. 19
  adversarial: true