- id: ts1_medium_01
  test_set: 1
  answer_type: medium
  difficulty: medium
  question: How does the directive define and regulate indirect discrimination?
  answer: Indirect discrimination occurs where an apparently neutral provision, criterion or practice would put persons of one sex at a particular disadvantage compared with persons of the other sex, unless that provision, criterion or practice is objectively justified by a legitimate aim, and the means of achieving that aim are appropriate and necessary.
  ground_truth: Indirect discrimination occurs where an apparently neutral provision, criterion or practice would put persons of one sex at a particular disadvantage compared with persons of the other sex, unless that provision, criterion or practice is objectively justified by a legitimate aim, and the means of achieving that aim are appropriate and necessary.
  article_refs:
  - Art. 2
  contexts:
  - Directive 2006/54/EC – Art. 2
  adversarial: false
- id: ts1_long_01
  test_set: 1
  answer_type: long
  difficulty: hard
  question: Explain the principle of equal pay laid down in Directive 2006/54/EC.
  answer: The directive establishes that men and women must receive the same pay for the same work or for work of equal value. The value of the work must be determined on the basis of objective and sex-neutral criteria, such as skills, responsibilities, and working conditions. Any job classification system must be constructed so as to eliminate direct and indirect discrimination.
  ground_truth: The directive establishes that men and women must receive the same pay for the same work or for work of equal value. The value of the work must be determined on the basis of objective and sex-neutral criteria, such as skills, responsibilities, and working conditions. Any job classification system must be constructed so as to eliminate direct and indirect discrimination.
  article_refs:
  - Art. 4
  - Title II
  contexts:
  - Directive 2006/54/EC – Art. 4
  - Directive 2006/54/EC – Title II
  adversarial: false
