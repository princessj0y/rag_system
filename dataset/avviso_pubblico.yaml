- id: ts5_short_03
  test_set: 5
  answer_type: short
  difficulty: easy
  question: >
    La Misura Pro.vi è compatibile con altri finanziamenti pubblici, come la Misura B1 o B2?
  answer: >
    No, la Misura Pro.vi è incompatibile con qualsiasi altro finanziamento pubblico, incluse le Misure B1 e B2, che sostenga attività afferenti alla medesima macroarea[cite: 4].
  ground_truth: >
    No, la Misura Pro.vi è incompatibile con qualsiasi altro finanziamento pubblico, incluse le Misure B1 e B2, che sostenga attività afferenti alla medesima macroarea[cite: 4].
