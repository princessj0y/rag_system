- id: ts5_short_01
  test_set: 5
  answer_type: short
  difficulty: easy
  question: >
    A quanto ammontano le risorse complessive disponibili per l'Avviso Pubblico PRO.VI 2025/2026 e qual è la quota di co-finanziamento?
  answer: >
    Le risorse complessive ammontano a € 100.000, di cui € 20.000 rappresentano la quota di co-finanziamento a carico dell'Ambito Territoriale Sociale di Crema[cite: 4].
