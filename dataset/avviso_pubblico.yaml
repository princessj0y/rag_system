- id: ts5_medium_02
  test_set: 5
  answer_type: medium
  difficulty: medium
  question: >
    Quali sono i criteri di priorità stabiliti per la formulazione delle graduatorie di ammissione al progetto?
  answer: >
    Verrà data priorità assoluta alle persone che hanno già attivo un Progetto di vita Indipendente all'interno di una forma di "abitare in autonomia" e che hanno concluso il percorso di uscita dal nucleo familiare d'origine[cite: 4]. In secondo ordine, saranno favorite le persone che intendono iniziare un percorso di avvicinamento tramite palestre per l'autonomia, destinato a esitare entro tre anni nell'uscita dal nucleo familiare[cite: 4]. Infine, si considereranno le persone non incluse nei punti precedenti[cite: 4].
  ground_truth: >
    Verrà data priorità assoluta alle persone che hanno già attivo un Progetto di vita Indipendente all'interno di una forma di "abitare in autonomia" e che hanno concluso il percorso di uscita dal nucleo familiare d'origine[cite: 4]. In secondo ordine, saranno favorite le persone che intendono iniziare un percorso di avvicinamento tramite palestre per l'autonomia, destinato a esitare entro tre anni nell'uscita dal nucleo familiare[cite: 4]. Infine, si considereranno le persone non incluse nei punti precedenti[cite: 4].
  article_refs:
  - CRITERI DI PRIORITA' E COMMISSIONE
  contexts:
  - 0 -Avviso Pubblico Pro.vi 2025.2026 sito-signed.pdf
  adversarial: false

- id: ts5_long_01
  test_set: 5
  answer_type: long
  difficulty: hard
  question: >
    Quali sono le regole, gli importi e le esclusioni specifiche stabilite per la Macroarea 1 relativa all'Assistente Personale?
  answer: >
    Per la Macroarea 1, il contributo è riconosciuto fino a un massimo di 800,00 euro mensili per progetto, a condizione che l'assistente personale sia contrattualizzato per almeno 10 ore a settimana[cite: 4]. L'assistente deve essere scelto e assunto direttamente dal beneficiario, facendo di norma riferimento al contratto collettivo nazionale (CCNL) del lavoro domestico[cite: 4]. Tuttavia, sono rigorosamente esclusi dal finanziamento i costi relativi alla registrazione del contratto, le spese di tenuta della contabilità (come buste paga e calcolo ferie/contributi), le spese di assicurazione per infortuni e le spese per il Servizio di Assistenza Domiciliare (SAD) già erogate[cite: 4].
  ground_truth: >
    Per la Macroarea 1, il contributo è riconosciuto fino a un massimo di 800,00 euro mensili per progetto, a condizione che l'assistente personale sia contrattualizzato per almeno 10 ore a settimana[cite: 4]. L'assistente deve essere scelto e assunto direttamente dal beneficiario, facendo di norma riferimento al contratto collettivo nazionale (CCNL) del lavoro domestico[cite: 4]. Tuttavia, sono rigorosamente esclusi dal finanziamento i costi relativi alla registrazione del contratto, le spese di tenuta della contabilità (come buste paga e calcolo ferie/contributi), le spese di assicurazione per infortuni e le spese per il Servizio di Assistenza Domiciliare (SAD) già erogate[cite: 4].
  article_refs:
  - INTERVENTI FINANZIABILI - 1 Macroarea
  contexts:
  - 0 -Avviso Pubblico Pro.vi 2025.2026 sito-signed.pdf
  adversarial: false

- id: ts5_long_02
  test_set: 5
  answer_type: long
  difficulty: hard
  question: >
    Come viene disciplinato l'intervento "Palestre autonomia" all'interno della Macroarea 3, inclusi i limiti temporali e i requisiti progettuali?
  answer: >
    L'intervento "Palestre autonomia" prevede il riconoscimento delle sole spese per il personale educativo, per un contributo massimo complessivo di 3.500,00 euro[cite: 4]. Tale percorso ha una durata massima di 3 anni, e durante l'ultimo anno il beneficiario deve necessariamente individuare una forma residenziale e avviare il progetto formale di abitare in autonomia[cite: 4]. Al fine di corrispondere a reali tempi di vita, le esperienze di questo ultimo anno devono avvenire prioritariamente in giorni di routine e non solo nei fine settimana[cite: 4]. Inoltre, le persone prese in carico tramite questo intervento PRO.VI non potranno contemporaneamente accedere al percorso di accompagnamento per l'autonomia previsto dalla misura Dopo di Noi (DDN)[cite: 4].
  ground_truth: >
    L'intervento "Palestre autonomia" prevede il riconoscimento delle sole spese per il personale educativo, per un contributo massimo complessivo di 3.500,00 euro[cite: 4]. Tale percorso ha una durata massima di 3 anni, e durante l'ultimo anno il beneficiario deve necessariamente individuare una forma residenziale e avviare il progetto formale di abitare in autonomia[cite: 4]. Al fine di corrispondere a reali tempi di vita, le esperienze di questo ultimo anno devono avvenire prioritariamente in giorni di routine e non solo nei fine settimana[cite: 4]. Inoltre, le persone prese in carico tramite questo intervento PRO.VI non potranno contemporaneamente accedere al percorso di accompagnamento per l'autonomia previsto dalla misura Dopo di Noi (DDN)[cite: 4].
  article_refs:
  - INTERVENTI FINANZIABILI - 3 Macroarea
