- id: ts5_medium_01
  test_set: 5
  answer_type: medium
  difficulty: medium
  question: >
    Quali sono i limiti ISEE previsti per poter accedere agli interventi dell'Avviso Pubblico PRO.VI?
  answer: >
    I destinatari devono essere in possesso di un ISEE sociosanitario minore o uguale a € 30.000,00[cite: 4]. In alternativa, per le persone con un grado di disabilità inferiore al 67%, è ammesso un ISEE ordinario minore o uguale a € 45.000,00[cite: 4].
