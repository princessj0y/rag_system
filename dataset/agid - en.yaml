    Seven actions are planned (from F.1 to F.7): pathways for approaching AI at school, mobility, widespread teaching in degree courses, strengthening of the national doctorate, upskilling and reskilling programs, education on the use of tools, and ITS courses focused on AI.
  article_refs:
    - Map of strategic actions
  contexts:
    - Italian Strategy for Artificial Intelligence 2024-2026 – Map of strategic actions
