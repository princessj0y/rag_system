- id: ts3_short_01
  test_set: 3
  answer_type: short
  difficulty: easy
  question: >
    What are the main strategic macro-objectives outlined in the document?
  answer: >
    The macro-objectives include supporting the adoption of AI applications for production models, promoting foundational and applied scientific research, and creating favorable conditions through talent training and the efficiency of the Public Administration.
  ground_truth: >
    The macro-objectives include supporting the adoption of AI applications for production models, promoting foundational and applied scientific research, and creating favorable conditions through talent training and the efficiency of the Public Administration.
  article_refs:
    - Introduction
  contexts:
    - Italian Strategy for Artificial Intelligence 2024-2026 – Introduction
  adversarial: false

