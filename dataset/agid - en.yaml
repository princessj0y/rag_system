- id: ts3_medium_02
  test_set: 3
  answer_type: medium
  difficulty: medium
  question: >
    How should the PA approach the procurement of Artificial Intelligence systems?
  answer: >
    The PA must rely on specific guidelines that help it navigate the acquisition of AI services; these guidelines will guarantee not only functional compliance but also adequate levels of security, adherence to European standards, and technological neutrality, avoiding the forced use of proprietary solutions.
  ground_truth: >
    The PA must rely on specific guidelines that help it navigate the acquisition of AI services; these guidelines will guarantee not only functional compliance but also adequate levels of security, adherence to European standards, and technological neutrality, avoiding the forced use of proprietary solutions.
  article_refs:
    - Action PA.2
    - Action PA.3
  contexts:
    - Italian Strategy for Artificial Intelligence 2024-2026 – Strategy for the PA
  adversarial: false

- id: ts3_long_01
  test_set: 3
  answer_type: long
  difficulty: hard
  question: >
    Analyze how the Italian strategy for AI intends to enhance the national network infrastructure and what are the motivations behind this choice.
  answer: >
    The growing use of AI-based solutions will cause a significant increase in data traffic, bringing the risk of congestion of current digital infrastructures. To respond to this challenge, the strategy promotes the development of smart networks capable of dynamically adapting to demand in real time. Furthermore, it encourages public-private collaboration for infrastructural investments and supports the standardization of interoperable solutions and edge computing technologies, useful for reducing the load and limiting the impact on the network.
  ground_truth: >
    The growing use of AI-based solutions will cause a significant increase in data traffic, bringing the risk of congestion of current digital infrastructures. To respond to this challenge, the strategy promotes the development of smart networks capable of dynamically adapting to demand in real time. Furthermore, it encourages public-private collaboration for infrastructural investments and supports the standardization of interoperable solutions and edge computing technologies, useful for reducing the load and limiting the impact on the network.
  article_refs:
    - Action A.2
  contexts:
    - Italian Strategy for Artificial Intelligence 2024-2026 – Action A.2
  adversarial: false

- id: ts3_long_02
  test_set: 3
  answer_type: long
  difficulty: hard
  question: >
    What are the actions planned by the strategy to support and facilitate the development of SMEs and the creation of innovative start-ups in the Artificial Intelligence sector?
  answer: >
    The strategy provides for the establishment of AI "facilitators" operating locally that offer innovation services to businesses, and the use of dedicated financial resources (ordinary finance, venture capital, vouchers) to support specific AI adoption projects in SMEs. As for start-ups, the plan aims to stimulate the creation of spin-offs and AI-Enterprise laboratories within universities to connect researchers and the industrial world. The overall objective is to build critical mass, networking institutions and private actors in order to attract investors more effectively.
  ground_truth: >
    The strategy provides for the establishment of AI "facilitators" operating locally that offer innovation services to businesses, and the use of dedicated financial resources (ordinary finance, venture capital, vouchers) to support specific AI adoption projects in SMEs. As for start-ups, the plan aims to stimulate the creation of spin-offs and AI-Enterprise laboratories within universities to connect researchers and the industrial world. The overall objective is to build critical mass, networking institutions and private actors in order to attract investors more effectively.
  article_refs:
    - Action I.1
    - Action I.2
    - Action I.4
  contexts:
    - Italian Strategy for Artificial Intelligence 2024-2026 – Strategy for Businesses
  adversarial: false

