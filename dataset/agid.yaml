- id: ts3_short_02
  test_set: 3
  answer_type: short
  difficulty: easy
  question: >
    Che cos'è la Fondazione per l'Intelligenza Artificiale descritta nel documento?
  answer: >
    È il soggetto posto sotto il diretto controllo della Presidenza del Consiglio dei Ministri che ha la responsabilità dell'attuazione, del coordinamento e del monitoraggio delle singole iniziative della strategia nazionale[cite: 2].
