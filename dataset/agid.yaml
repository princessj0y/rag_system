- id: ts3_medium_04
  test_set: 3
  answer_type: medium
  difficulty: medium
  question: >
    Nella "Mappa delle azioni strategiche", quante e quali sono le azioni specifiche previste per la macroarea "Formazione"?
  answer: >
    Sono previste sette azioni (da F.1 a F.7): percorsi per l'avvicinamento all'IA alla scuola, mobilità, didattica diffusa nei corsi di laurea, potenziamento del dottorato nazionale, programmi di upskilling e reskilling, educazione all'utilizzo degli strumenti, e corsi ITS focalizzati sull'IA[cite: 2].
