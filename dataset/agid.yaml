- id: ts3_medium_02
  test_set: 3
  answer_type: medium
  difficulty: medium
  question: >
    In che modo la PA dovrebbe approcciare il procurement di sistemi di Intelligenza Artificiale?
  answer: >
    La PA dovrà basarsi su linee guida specifiche che la aiutino ad orientarsi nell'acquisizione di servizi di IA; queste linee guida garantiranno non solo la conformità funzionale, ma anche adeguati livelli di sicurezza, aderenza alle norme europee e neutralità tecnologica, evitando l'utilizzo obbligato di soluzioni proprietarie[cite: 2].
  ground_truth: >
    La PA dovrà basarsi su linee guida specifiche che la aiutino ad orientarsi nell'acquisizione di servizi di IA; queste linee guida garantiranno non solo la conformità funzionale, ma anche adeguati livelli di sicurezza, aderenza alle norme europee e neutralità tecnologica, evitando l'utilizzo obbligato di soluzioni proprietarie[cite: 2].
