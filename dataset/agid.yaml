- id: ts3_short_03
  test_set: 3
  answer_type: short
  difficulty: easy
  question: >
    Quale rischio specifico è associato al "non fare" nell'ambito dell'IA per l'Italia?
  answer: >
    Un approccio timido rischia di risolversi in uno spreco di risorse e in un'ulteriore perdita di competitività, portando l'Italia a limitarsi a importare soluzioni esistenti e sviluppate altrove[cite: 2].
