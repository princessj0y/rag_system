- id: ts3_short_01
  test_set: 3
  answer_type: short
  difficulty: easy
  question: >
    Quali sono i macro-obiettivi strategici principali delineati nel documento?
  answer: >
    I macro-obiettivi includono il sostegno all'adozione di applicazioni di IA per modelli produttivi, la promozione della ricerca scientifica fondazionale e applicata, e la creazione di condizioni favorevoli tramite la formazione dei talenti e l'efficientamento della Pubblica Amministrazione[cite: 2].
  ground_truth: >
    I macro-obiettivi includono il sostegno all'adozione di applicazioni di IA per modelli produttivi, la promozione della ricerca scientifica fondazionale e applicata, e la creazione di condizioni favorevoli tramite la formazione dei talenti e l'efficientamento della Pubblica Amministrazione[cite: 2].
