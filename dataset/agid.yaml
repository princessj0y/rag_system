- id: ts3_medium_01
  test_set: 3
  answer_type: medium
  difficulty: medium
  question: >
    Come intende la strategia affrontare il rischio del divario digitale (digital divide) in Italia?
  answer: >
    La strategia prevede di arginare il rischio di accrescere i divari e le disomogeneità territoriali promuovendo iniziative di sistema trasparenti e accessibili a livello nazionale, investendo sul capitale umano e su percorsi mirati di upskilling e reskilling[cite: 2].
